name: 網頁體驗版（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --no-save --legacy-peer-deps react-native-web@~0.21.4 react-dom@19.3.0
      - name: 做成網頁
        env:
          KPF_DEMO: '1'
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          CI: '1'
        run: |
          npx expo export --platform web --output-dir dist
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
